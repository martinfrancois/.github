name: PR claim check
# Reusable workflow behind the pull request claim check in martinfrancois's OSS
# repositories. A repository calls it from a scheduled workflow.
#
# Scans the open pull requests from contributors and comments on and labels
# one that closes an issue its author doesn't hold, or an issue that another
# open pull request already closes. A pull request that closes no issue (a
# small fix) passes. Each pull request gets at most one comment, updated in
# place when the findings change. Pull requests opened before the claim flow
# started are left alone, because their authors couldn't know about it.
#
# It runs on a schedule instead of pull_request_target, which GitHub blocks
# by default on public repositories. Never check out or run code from a pull
# request here, only read metadata through the API.
on:
  workflow_call:
    inputs:
      conflict-label:
        description: Label added to a pull request with a claim conflict. It must exist in the repository.
        type: string
        default: claim conflict
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: read
      pull-requests: write
    env:
      CONFLICT_LABEL: ${{ inputs.conflict-label }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = process.env.CONFLICT_LABEL;
            const marker = "<!-- pr-claim-check -->";
            const flowStart = Date.parse("2026-11-09T00:00:00Z");

            // GitHub resolves the closing keywords itself; read its answer
            // instead of parsing the descriptions.
            const pullRequests = [];
            let after = null;
            do {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $after: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequests(states: OPEN, first: 50, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        number
                        createdAt
                        authorAssociation
                        author { __typename login }
                        labels(first: 50) { nodes { name } }
                        closingIssuesReferences(first: 10) {
                          nodes {
                            number
                            repository { nameWithOwner }
                            assignees(first: 10) { nodes { login } }
                            closedByPullRequestsReferences(first: 20, includeClosedPrs: false) {
                              nodes { number }
                            }
                          }
                        }
                      }
                    }
                  }
                }`,
                { owner, repo, after },
              );
              const page = repository.pullRequests;
              pullRequests.push(...page.nodes);
              after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (after);

            const problemsOf = (pr) => {
              const author = pr.author.login;
              const problems = [];
              for (const issue of pr.closingIssuesReferences.nodes) {
                if (issue.repository.nameWithOwner !== `${owner}/${repo}`) continue;
                const assignees = issue.assignees.nodes.map((a) => a.login);
                if (assignees.length === 0) {
                  problems.push(`#${issue.number} isn't assigned to you yet.`);
                } else if (!assignees.includes(author)) {
                  problems.push(
                    `#${issue.number} is assigned to ${assignees.map((l) => `\`${l}\``).join(", ")}.`,
                  );
                }
                const otherPrs = issue.closedByPullRequestsReferences.nodes
                  .map((p) => p.number)
                  .filter((n) => n !== pr.number);
                if (otherPrs.length > 0) {
                  problems.push(
                    `#${issue.number} already has an open pull request: ${otherPrs.map((n) => `#${n}`).join(", ")}.`,
                  );
                }
              }
              return problems;
            };

            const conflictBody = (author, problems) =>
              [
                marker,
                `@${author} Thanks for the pull request! Before it goes further, please check this:`,
                "",
                ...problems.map((p) => `- ${p}`),
                "",
                "Before starting on an issue, check that nobody is assigned to it and that no open pull request addresses it, then claim it by commenting `/take` on the issue and wait for the assignment (see CONTRIBUTING.md). That way two people don't do the same work. If the issue is free, comment `/take` on it now. martinfrancois will decide which pull request goes ahead if two overlap. This check runs every hour and updates this comment.",
              ].join("\n");
            const resolvedBody = (author) =>
              `${marker}\n@${author} Thanks, everything this check raised earlier is resolved.`;

            for (const pr of pullRequests) {
              // Maintainers may open a pull request for any issue, and bots
              // don't claim issues. A deleted account has no author.
              if (!pr.author || pr.author.__typename === "Bot") continue;
              if (["OWNER", "MEMBER", "COLLABORATOR"].includes(pr.authorAssociation)) continue;

              const author = pr.author.login;
              const problems = problemsOf(pr);
              const labelled = pr.labels.nodes.some((l) => l.name === label);
              // Most pull requests have nothing to report and no earlier
              // finding, so they cost no further calls.
              if (problems.length === 0 && !labelled) continue;
              if (!labelled && Date.parse(pr.createdAt) < flowStart) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });
              // Only a bot-written marker counts, so nobody can fake one.
              const existing = comments.find(
                (c) => c.user?.type === "Bot" && c.body?.startsWith(marker),
              );

              if (problems.length === 0) {
                // A `/take` or an edit cleared the findings.
                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pr.number,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (existing && existing.body !== resolvedBody(author)) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                    body: resolvedBody(author),
                  });
                }
                continue;
              }

              const body = conflictBody(author, problems);
              // Same findings as last time: nothing to say again. If a
              // maintainer removed the label since, it stays removed.
              if (existing?.body === body) continue;

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [label],
              });
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body,
                });
              }
              core.info(`#${pr.number}: ${problems.join(" ")}`);
            }
